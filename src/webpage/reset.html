<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>修复中</title>
<style>
  body { background:#1a1a1a; color:#fff; font-family:-apple-system,sans-serif; text-align:center; padding:80px 24px 0; }
  h1 { font-size: 48px; margin-bottom: 8px; }
  h2 { font-weight: normal; color: #ccc; }
  #status { color: #5865F2; font-size: 18px; margin-top: 32px; }
  .done { color: #43b581 !important; }
  .step { color: #999; font-size: 14px; margin: 4px 0; }
</style>
</head>
<body>
<h1>🔧</h1>
<h2>正在修复，请稍等...</h2>
<p id="status">清理中</p>
<div id="steps"></div>
<script>
(async () => {
  const status = document.getElementById('status');
  const steps = document.getElementById('steps');
  const log = (t) => { const p = document.createElement('p'); p.className='step'; p.textContent=t; steps.appendChild(p); };
  try {
    // 1. Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      log('✓ 清理完成 (' + regs.length + ' 项)');
    }
    // 2. Delete all caches
    const keys = await caches.keys();
    for (const k of keys) await caches.delete(k);
    if (keys.length) log('✓ 缓存已清除');
    // 3. Clear session storage (keep localStorage for login credentials)
    sessionStorage.clear();
    log('✓ 会话已重置');

    status.textContent = '修复完成！正在重新打开...';
    status.className = 'done';
    const target = '/app?_cv=' + Date.now();
    setTimeout(() => { window.location.replace(target); }, 800);
    setTimeout(() => { window.location.href = target; }, 1800);
    setTimeout(() => { window.location.assign(target); }, 3200);
  } catch (e) {
    status.textContent = '出错了：' + e.message;
    log('请上滑关闭应用重新打开试试');
  }
})();
</script>
</body></html>
