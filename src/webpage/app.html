			}

			body.no-theme,

			}

				object-fit: contain;
			}

				html,
				body.no-theme,
				#loading {
					background: #9397bd;
					color: #16191b;
				}
			}
		</style>
		<link href="/style.css" rel="preload" as="style" />
		<link href="/themes.css" rel="preload" as="style" />
		<link href="/style.css" rel="stylesheet" media="print" onload="this.media='all'" />
		<link
			href="/themes.css"
			rel="stylesheet"
			id="lightcss"
			media="print"
			onload="this.media='all'"
		/>

			<link href="/style.css" rel="stylesheet" />
			<link href="/themes.css" rel="stylesheet" id="lightcss" />
		</noscript>
		<link rel="icon" type="image/png" href="/avatars/1469391000983101480/b2fde4cb284902788fe4278789de063c.png?size=64&v=2" id="favicon" />
		<link rel="apple-touch-icon" href="/avatars/1469391000983101480/b2fde4cb284902788fe4278789de063c.png?size=512" />
		<link rel="manifest" href="/manifest.json" />
	</head>

	<body class="no-theme">
		<div id="loading" class="loading">
			<div class="centeritem">
				<img src="/logo.svg" style="width: 3in; height: 3in" />
				<h1 id="loadingText">Lucky 5L 加载中</h1>
				<p id="load-desc" style="color: #999; font-size: 14px;">正在加载程序...</p>
				<h2 id="load-hint" style="color: #ccc; margin-top: 32px;">卡住了？上滑关闭应用重新打开试试 😊</h2>
				<p style="margin-top: 16px;"><a href="/reset" style="color: #fff; font-size: 16px; text-decoration: underline; text-underline-offset: 4px;">还是不行？点这里修复 🔧</a></p>
				<p id="switchaccounts" style="color: #666; font-size: 13px; margin-top: 16px; cursor: pointer;">切换账号</p>
				<p id="loading-debug" style="color: #888; font-size: 10px; font-family: monospace; margin-top: 24px;"></p>
				<script>
					// Inline debug — runs before any module loads
					(function() {
						var d = document.getElementById('loading-debug');
						var t = new Date().toLocaleTimeString();
						var msgs = [];
						function log(m) { msgs.push('[' + new Date().toLocaleTimeString() + '] ' + m); d.textContent = msgs.slice(-3).join(' | '); }
						log('html ok, path=' + location.pathname);
						window.__loadingDebug = log;
						// Check if SW is blocking
						if ('serviceWorker' in navigator) {
							navigator.serviceWorker.ready.then(function() { log('sw ready'); });
						}
						// Timeout warning
						setTimeout(function() { log('⚠️ 10s timeout'); d.style.color = '#f04747'; }, 10000);
						setTimeout(function() { log('⚠️ 30s timeout - JS可能没加载'); d.style.color = '#f04747'; d.style.fontSize = '12px'; }, 30000);
						// Detect if module script loads
						window.__moduleLoaded = false;
						window.__cacheBootstrapTried = false;
						window.__bootFromShellCache = async function() {
							if (window.__cacheBootstrapTried || window.__moduleLoaded || !('caches' in window)) return false;
							window.__cacheBootstrapTried = true;
							log('尝试从本地缓存恢复 JS');
							try {
								const cacheNames = (await caches.keys())
									.filter(function(name) { return name.indexOf('cache-') === 0; })
									.sort()
									.reverse();
								for (const cacheName of cacheNames) {
									const cache = await caches.open(cacheName);
									const reqUrl = new URL('/index.js', window.location.origin).toString();
									const resp = await cache.match(reqUrl) || await cache.match('/index.js');
									if (!resp) continue;
									let code = await resp.text();
									code = code
										.replaceAll('import("./index.js")', 'import("/index.js")')
										.replaceAll('import("../index.js")', 'import("/index.js")');
									const blobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
									try {
										await import(blobUrl);
										log('已从本地缓存启动 JS');
										return true;
									} finally {
										setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 10000);
									}
								}
								log('本地缓存里没有 index.js');
							} catch (e) {
								log('缓存启动失败: ' + (e && e.message ? e.message : e));
							}
							return false;
						};
						setTimeout(function() {
							if (!window.__moduleLoaded) window.__bootFromShellCache();
						}, 3000);
						setTimeout(function() {
							if (!window.__moduleLoaded) log('index.js 未执行');
						}, 5000);
					})();
				</script>
			</div>
		</div>
		<div id="reconnect-banner">
			<span class="reconnect-spinner"></span>
			<span id="reconnect-text">正在重新连接...</span>

		<div id="ws-diag" style="position:fixed;bottom:0;right:0;z-index:99999;font-size:9px;color:#666;background:rgba(0,0,0,0.5);padding:1px 4px;pointer-events:none;font-family:monospace;"></div>
		<div id="quick-bubbles"></div>
		<div class="flexltr" id="page">

			<div class="flexttb channelflex">

				</div>
				<div id="channels"></div>
				<div class="flexttb">

						<div id="user-actions" class="flexltr">

					</div>

			</div>
			<div class="flexttb flexgrow" id="mainarea">

					<span class="flexltr" style="align-items: center">
						<span id="channelname">Channel name</span>

					</span>
					<div class="spaceElm"></div>
					<div id="pinnedMDiv">
						<span class="svgicon svg-pin" id="pinnedM"></span>
					</div>
					<div class="searchMeta">
						<div contenteditable="true" class="searchBox" id="searchBox"></div>
						<span id="searchX" class="svgicon svg-search" contenteditable="false"></span>
					</div>
					<label for="memberlisttoggle" id="memberlisttoggleicon">
						<span class="svgicon svg-friends"></span>
					</label>
					<span class="svgicon svg-update" i18n="updateAv" id="updateIcon" hidden></span>
					<input type="checkbox" id="memberlisttoggle" checked />
				</div>
				<div class="flexltr flexgrow">
					<div class="flexttb flexgrow" id="voiceArea"></div>
					<div class="flexttb flexgrow" id="chatArea">
						<div id="channelw" class="flexltr" tabindex="-1">
							<div id="scrollWrap"></div>
							<div id="loadingdiv"></div>
						</div>
						<div style="position: relative">
							<div id="searchOptions" class="flexttb searchOptions"></div>
						</div>
						<div id="pasteimage" class="flexltr"></div>
						<div id="replybox" class="hideReplyBox"></div>
						<div id="typediv">
							<div id="realbox">
								<div class="outerTypeBox">
									<span class="svg-upload svgicon" id="upload"></span>
									<div id="typebox" contenteditable="true"></div>
									<span class="svgicon svg-gif" id="gifTB"></span>
									<span class="svgicon svg-sticker" id="stickerTB"></span>
									<span class="svgicon svg-emoji" id="emojiTB"></span>
									<span id="voiceRecordBtn" title="录音">🎙</span>
									<div id="voiceRecordBar">
										<span class="rec-dot"></span>
										<span class="rec-time">0:00</span>
										<button class="rec-stop" title="发送"></button>
										<button class="rec-cancel" title="取消">✕</button>
									</div>
								</div>
							</div>
							<div id="typing" class="hidden flexltr">
								<p id="typingtext">typing</p>
								<div class="flexltr loading-indicator">
									<div class="dot"></div>
									<div class="dot"></div>
									<div class="dot"></div>
								</div>
							</div>
						</div>
					</div>
					<div class="flexttb" id="sideContainDiv">
						<div class="flexttb" id="sideDiv"></div>
						<div id="player" class="flexttb"></div>
					</div>
				</div>
			</div>
		</div>
